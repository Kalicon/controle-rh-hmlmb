# --- AMBIENTE DE PRODUCAO ---
spring.profiles.active=prod

# --- CONEXAO COM O SUPABASE (PRODUCAO) ---
# IMPORTANTE: Use variaveis de ambiente na hospedagem. Nunca commite senhas!
# Configure as variaveis: DB_URL, DB_USERNAME, DB_PASSWORD no servidor/CI-CD
spring.datasource.url=${DB_URL:jdbc:postgresql://db.hmhpxavrootipfmkoztw.supabase.co:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:CONFIGURE_SUA_SENHA_AQUI}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000

# --- CONFIGURACAO DO HIBERNATE ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- CONFIGURACAO DE UPLOAD DE PDF ---
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# --- AJUSTE DE DATA/HORA (PARA O RH DO HMLMB) ---
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# --- LOGGING ---
logging.file.name=logs/rh-ferias-prod.log
logging.level.root=WARN
logging.level.com.hmlmb=INFO
