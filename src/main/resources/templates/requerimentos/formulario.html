<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::.content-wrapper})}">
<head>
    <title th:text="${requerimento.id == null} ? 'Novo Requerimento' : 'Editar Requerimento'"></title>
</head>
<body>
<div class="content-wrapper">
    <section class="content-header">
        <div class="container-fluid">
            <div class="row mb-2">
                <div class="col-sm-6">
                    <h1 th:text="${requerimento.id == null} ? 'Novo Requerimento' : 'Editar Requerimento'"></h1>
                </div>
            </div>
        </div>
    </section>

    <section class="content">
        <div class="container-fluid">
            <div class="card card-primary">
                <div class="card-header">
                    <h3 class="card-title">Dados do Requerimento</h3>
                </div>
                <form th:action="@{/requerimentos}" th:object="${requerimento}" method="post" id="requerimentoForm">
                    <div class="card-body">

                        <div class="form-group">
                            <label for="funcionarioNome">Nome do Funcionário (Digite para buscar)</label>
                            <input list="funcionariosList" id="funcionarioNome" name="nome" th:value="*{nome}" class="form-control" required autocomplete="off" placeholder="Comece a digitar o nome...">
                            <datalist id="funcionariosList"></datalist>
                        </div>

                        <div class="row">
                            <div class="col-md-3">
                                <div class="form-group">
                                    <label for="rs">RS</label>
                                    <input type="text" id="rs" th:field="*{rs}" class="form-control" readonly tabindex="-1">
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="form-group">
                                    <label for="pv">PV</label>
                                    <input type="number" id="pv" th:field="*{pv}" class="form-control" readonly tabindex="-1">
                                </div>
                            </div>
                             <div class="col-md-3">
                                <div class="form-group">
                                    <label for="dataEntrada">Data de Entrada</label>
                                    <input type="date" id="dataEntrada" th:field="*{dataEntrada}" class="form-control" readonly tabindex="-1">
                                </div>
                            </div>
                             <div class="col-md-3">
                                <div class="form-group">
                                    <label for="exercicio">Exercício</label>
                                    <input type="number" id="exercicio" th:field="*{exercicio}" class="form-control" readonly tabindex="-1">
                                </div>
                            </div>
                        </div>

                        <hr>

                        <div class="row">
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label for="dataInicio">Data de Início</label>
                                    <input type="date" id="dataInicio" th:field="*{dataInicio}" class="form-control" required tabindex="1">
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label for="quantidadeDias">Quantidade de Dias</label>
                                    <input type="number" id="quantidadeDias" th:field="*{quantidadeDias}" class="form-control" required min="1" tabindex="2">
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label for="dataTermino">Data de Término</label>
                                    <input type="date" id="dataTermino" th:field="*{dataTermino}" class="form-control" readonly tabindex="-1">
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="observacoes">Observações</label>
                            <textarea id="observacoes" th:field="*{observacoes}" class="form-control" rows="3" tabindex="3"></textarea>
                        </div>

                        <input type="hidden" id="cargo" th:field="*{cargo}">
                        <input type="hidden" id="regimeJuridico" th:field="*{regimeJuridico}">
                        <input type="hidden" th:field="*{id}">

                    </div>
                    <div class="card-footer">
                        <button type="submit" class="btn btn-primary" tabindex="4">Salvar Requerimento</button>
                        <a th:href="@{/requerimentos/lista}" class="btn btn-secondary" tabindex="5">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <script>
    document.addEventListener('DOMContentLoaded', function () {
        const inputNome = document.getElementById('funcionarioNome');
        const datalist = document.getElementById('funcionariosList');

        const inputRs = document.getElementById('rs');
        const inputPv = document.getElementById('pv');
        const inputCargo = document.getElementById('cargo');
        const inputRegime = document.getElementById('regimeJuridico');

        const dataInicioInput = document.getElementById('dataInicio');
        const quantidadeDiasInput = document.getElementById('quantidadeDias');
        const dataTerminoInput = document.getElementById('dataTermino');
        const exercicioInput = document.getElementById('exercicio');
        const dataEntradaInput = document.getElementById('dataEntrada');
        const form = document.getElementById('requerimentoForm');

        let todosFuncionarios = [];

        function setDatasPadrao() {
            if (!exercicioInput.value) {
                exercicioInput.value = new Date().getFullYear();
            }
            if (!dataEntradaInput.value) {
                dataEntradaInput.value = new Date().toISOString().split('T')[0];
            }
        }
        setDatasPadrao();

        fetch('/requerimentos/api/servidores')
            .then(response => response.json())
            .then(data => {
                todosFuncionarios = data;
                data.forEach(func => {
                    const option = document.createElement('option');
                    option.value = func.nome;
                    datalist.appendChild(option);
                });
            })
            .catch(err => console.error("Erro ao carregar lista de funcionários:", err));

        inputNome.addEventListener('input', function() {
            const nomeDigitado = this.value;
            const funcionarioEncontrado = todosFuncionarios.find(f => f.nome === nomeDigitado);

            if (funcionarioEncontrado) {
                inputRs.value = funcionarioEncontrado.rs || '';
                inputPv.value = funcionarioEncontrado.pv || '';
                inputCargo.value = funcionarioEncontrado.cargo || '';
                inputRegime.value = funcionarioEncontrado.regimeJuridico || '';
                dataInicioInput.focus();
            } else {
                inputRs.value = '';
                inputPv.value = '';
                inputCargo.value = '';
                inputRegime.value = '';
            }
        });

        function calcularDataTermino() {
            const dataInicio = dataInicioInput.value;
            const dias = parseInt(quantidadeDiasInput.value, 10);

            if (dataInicio && dias > 0) {
                const data = new Date(dataInicio + 'T00:00:00');
                data.setDate(data.getDate() + dias - 1);

                const ano = data.getFullYear();
                const mes = String(data.getMonth() + 1).padStart(2, '0');
                const dia = String(data.getDate()).padStart(2, '0');

                dataTerminoInput.value = `${ano}-${mes}-${dia}`;
            } else {
                dataTerminoInput.value = '';
            }
        }

        dataInicioInput.addEventListener('change', calcularDataTermino);
        quantidadeDiasInput.addEventListener('input', calcularDataTermino);
        calcularDataTermino();

        form.addEventListener('submit', function(event) {
            event.preventDefault();
            const formData = new FormData(form);

            // Como o formulário é um POST padrão, o Thymeleaf já injeta o _csrf no FormData.
            // Não precisamos de cabeçalho extra aqui.
            fetch(form.action, {
                method: 'POST',
                body: new URLSearchParams(formData)
            })
            .then(response => {
                if (response.ok) {
                    if (confirm('Requerimento salvo com sucesso! Deseja adicionar outro?')) {
                        form.reset();
                        setDatasPadrao();
                        inputNome.focus();
                    } else {
                        window.location.href = '/requerimentos/lista';
                    }
                } else {
                    alert('Ocorreu um erro ao salvar o requerimento.');
                }
            })
            .catch(error => {
                alert('Ocorreu um erro de rede ao salvar o requerimento.');
            });
        });
    });
    </script>
</div>
</body>
</html>
