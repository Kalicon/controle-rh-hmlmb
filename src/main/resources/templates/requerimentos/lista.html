<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Lista de Requerimentos</title>
</head>
<body>
    <section>
        <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
            <h1 class="h2">Gestão de Requerimentos</h1>
            <div class="btn-toolbar mb-2 mb-md-0">
                <a th:href="@{/requerimentos/formulario}" class="btn btn-primary shadow-sm">
                    <i class="fas fa-plus me-1"></i> Novo Requerimento
                </a>
            </div>
        </div>

        <div class="card shadow-sm border-0 mb-4">
            <div class="card-header bg-white py-3">
                <h6 class="m-0 font-weight-bold text-secondary"><i class="fas fa-filter me-2"></i>Filtros</h6>
            </div>
            <div class="card-body bg-light">
                <form th:action="@{/requerimentos/lista}" method="get" class="row g-3">
                    <div class="col-md-4">
                        <label for="ano" class="form-label fw-bold">Exercício</label>
                        <input type="number" class="form-control" id="ano" name="ano" th:value="${exercicioAtual}" placeholder="Ano do Exercício">
                    </div>
                    <div class="col-md-4">
                        <label for="mes" class="form-label fw-bold">Mês</label>
                        <select id="mes" name="mes" class="form-select">
                            <option value="">Todos os meses</option>
                            <option th:each="m : ${#numbers.sequence(1, 12)}"
                                    th:value="${m}"
                                    th:text="${T(java.time.Month).of(m).getDisplayName(T(java.time.format.TextStyle).FULL, new java.util.Locale('pt', 'BR'))}"
                                    th:selected="${mesAtual != null and mesAtual == m}"></option>
                        </select>
                    </div>
                    <div class="col-md-4 d-flex align-items-end">
                        <button type="submit" class="btn btn-secondary w-100 shadow-sm">
                            <i class="fas fa-search me-1"></i> Buscar
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-header bg-white py-3">
                <h6 class="m-0 font-weight-bold text-primary"><i class="fas fa-file-signature me-2"></i>Requerimentos Encontrados</h6>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table id="requerimentosTable" class="table table-hover table-sm align-middle">
                        <thead class="table-light">
                        <tr>
                            <th scope="col">#</th>
                            <th scope="col">Servidor</th>
                            <th scope="col">Cargo</th>
                            <th scope="col">Início</th>
                            <th scope="col">Fim</th>
                            <th scope="col">Exercício</th>
                            <th scope="col" class="text-center no-sort">Ações</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="req : ${requerimentos}">
                            <th scope="row" th:text="${req.id}"></th>
                            <td class="fw-bold text-secondary" th:text="${req.nome}"></td>
                            <td th:text="${req.cargo}"></td>
                            <td th:text="${req.dataInicio != null ? #temporals.format(req.dataInicio, 'dd/MM/yyyy') : ''}"></td>
                            <td th:text="${req.dataTermino != null ? #temporals.format(req.dataTermino, 'dd/MM/yyyy') : ''}"></td>
                            <td><span class="badge bg-warning text-dark" th:text="${req.exercicio}"></span></td>
                            <td class="text-center">
                                <a th:href="@{/requerimentos/editar/{id}(id=${req.id})}" class="btn btn-sm btn-outline-primary" title="Editar">
                                    <i class="fas fa-edit"></i>
                                </a>
                                <a th:href="@{/requerimentos/deletar/{id}(id=${req.id})}" class="btn btn-sm btn-outline-danger" title="Deletar"
                                   onclick="return confirm('Tem certeza que deseja deletar este requerimento? Essa ação não pode ser desfeita.');">
                                    <i class="fas fa-trash-alt"></i>
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>

    <!-- Aqui seria o script do datatable -->
</body>
</html>
