<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Lista de Funcionários</title>
</head>
<body>
    <section>
        <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
            <h1 class="h2">Gestão de Funcionários</h1>
            <div class="btn-toolbar mb-2 mb-md-0">
                <a th:href="@{/funcionarios/formulario}" class="btn btn-primary shadow-sm">
                    <i class="fas fa-plus me-1"></i> Novo Funcionário
                </a>
            </div>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-header bg-white py-3">
                <h6 class="m-0 font-weight-bold text-primary"><i class="fas fa-list me-2"></i>Funcionários Cadastrados</h6>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table id="funcionariosTable" class="table table-hover table-sm align-middle">
                        <thead class="table-light">
                        <tr>
                            <th scope="col">#</th>
                            <th scope="col">Nome</th>
                            <th scope="col">Cargo</th>
                            <th scope="col">RS</th>
                            <th scope="col">Regime</th>
                            <th scope="col" class="text-center no-sort">Ações</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="func : ${funcionarios}">
                            <th scope="row" th:text="${func.id}"></th>
                            <td class="fw-bold text-secondary" th:text="${func.nome}"></td>
                            <td th:text="${func.cargo}"></td>
                            <td th:text="${func.rs}"></td>
                            <td><span class="badge bg-info text-dark" th:text="${func.regimeJuridico}"></span></td>
                            <td class="text-center">
                                <a th:href="@{/funcionarios/editar/{id}(id=${func.id})}" class="btn btn-sm btn-outline-primary" title="Editar">
                                    <i class="fas fa-edit"></i>
                                </a>
                                <a th:href="@{/funcionarios/deletar/{id}(id=${func.id})}" class="btn btn-sm btn-outline-danger" title="Deletar"
                                   onclick="return confirm('Tem certeza que deseja deletar este funcionário? Essa ação não pode ser desfeita.');">
                                    <i class="fas fa-trash-alt"></i>
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>

    <!-- Aqui seria o script do datatable -->
</body>
</html>
