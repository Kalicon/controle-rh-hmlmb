<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::.content-wrapper})}">
<head>
    <title>Gerenciamento de Usuários</title>
</head>
<body>
<div class="content-wrapper">
    <section class="content-header">
        <div class="container-fluid">
            <div class="row mb-2">
                <div class="col-sm-6">
                    <h1>Gerenciamento de Usuários</h1>
                </div>
                <div class="col-sm-6">
                    <button class="btn btn-primary float-sm-right" data-toggle="modal" data-target="#createUserModal">
                        <i class="fas fa-plus"></i> Novo Usuário
                    </button>
                </div>
            </div>
        </div>
    </section>

    <section class="content">
        <div class="container-fluid">
            <!-- Mensagens de Alerta -->
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                <span th:text="${successMessage}"></span>
                <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <span th:text="${errorMessage}"></span>
                <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>

            <!-- Tabela de Usuários -->
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">Lista de Usuários</h3>
                </div>
                <div class="card-body table-responsive p-0">
                    <table class="table table-hover text-nowrap">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Username</th>
                            <th>Status</th>
                            <th>Permissões</th>
                            <th>Ações</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="user : ${users}">
                            <td th:text="${user.id}"></td>
                            <td th:text="${user.username}"></td>
                            <td>
                                <span class="badge" th:classappend="${user.enabled} ? 'badge-success' : 'badge-danger'"
                                      th:text="${user.enabled} ? 'Ativo' : 'Inativo'"></span>
                            </td>
                            <td>
                                <span th:each="role : ${user.roles}" th:text="${role.name} + ' '" class="badge badge-info mr-1"></span>
                            </td>
                            <td>
                                <button class="btn btn-sm btn-warning btn-edit"
                                        th:data-id="${user.id}"
                                        th:data-username="${user.username}"
                                        th:data-enabled="${user.enabled}"
                                        th:data-roles="${#strings.listJoin(user.roles.![name], ',')}"
                                        data-toggle="modal" data-target="#editUserModal" title="Editar">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="btn btn-sm btn-danger btn-delete"
                                        th:data-id="${user.id}"
                                        th:data-username="${user.username}"
                                        data-toggle="modal" data-target="#deleteUserModal" title="Excluir">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(users)}">
                            <td colspan="5" class="text-center">Nenhum usuário cadastrado.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>

    <!-- Modal Novo Usuário -->
    <div class="modal fade" id="createUserModal" tabindex="-1" role="dialog" aria-labelledby="createUserModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="createUserModalLabel">Novo Usuário</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <form th:action="@{/users/create}" method="post">
                    <div class="modal-body">
                        <div class="form-group">
                            <label for="createUsername">Username</label>
                            <input type="text" class="form-control" id="createUsername" name="username" required>
                        </div>
                        <div class="form-group">
                            <label for="createPassword">Senha</label>
                            <input type="password" class="form-control" id="createPassword" name="password" required>
                        </div>
                        <div class="form-group">
                            <label>Permissões</label><br>
                            <div class="custom-control custom-checkbox custom-control-inline">
                                <input type="checkbox" class="custom-control-input" id="createRoleAdmin" name="roles" value="ROLE_ADMIN">
                                <label class="custom-control-label" for="createRoleAdmin">Administrador (ROLE_ADMIN)</label>
                            </div>
                            <div class="custom-control custom-checkbox custom-control-inline">
                                <input type="checkbox" class="custom-control-input" id="createRoleUser" name="roles" value="ROLE_USER" checked>
                                <label class="custom-control-label" for="createRoleUser">Usuário (ROLE_USER)</label>
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="custom-control custom-switch">
                                <input type="checkbox" class="custom-control-input" id="createEnabled" name="enabled" value="true" checked>
                                <label class="custom-control-label" for="createEnabled">Usuário Ativo</label>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Salvar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal Editar Usuário -->
    <div class="modal fade" id="editUserModal" tabindex="-1" role="dialog" aria-labelledby="editUserModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editUserModalLabel">Editar Usuário</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <form id="editUserForm" method="post">
                    <div class="modal-body">
                        <div class="form-group">
                            <label for="editUsername">Username</label>
                            <input type="text" class="form-control" id="editUsername" name="username" required>
                        </div>
                        <div class="form-group">
                            <label for="editPassword">Nova Senha (deixe em branco para manter atual)</label>
                            <input type="password" class="form-control" id="editPassword" name="password">
                        </div>
                        <div class="form-group">
                            <label>Permissões</label><br>
                            <div class="custom-control custom-checkbox custom-control-inline">
                                <input type="checkbox" class="custom-control-input role-checkbox" id="editRoleAdmin" name="roles" value="ROLE_ADMIN">
                                <label class="custom-control-label" for="editRoleAdmin">Administrador (ROLE_ADMIN)</label>
                            </div>
                            <div class="custom-control custom-checkbox custom-control-inline">
                                <input type="checkbox" class="custom-control-input role-checkbox" id="editRoleUser" name="roles" value="ROLE_USER">
                                <label class="custom-control-label" for="editRoleUser">Usuário (ROLE_USER)</label>
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="custom-control custom-switch">
                                <input type="checkbox" class="custom-control-input" id="editEnabled" name="enabled" value="true">
                                <label class="custom-control-label" for="editEnabled">Usuário Ativo</label>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Salvar Alterações</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal Excluir Usuário -->
    <div class="modal fade" id="deleteUserModal" tabindex="-1" role="dialog" aria-labelledby="deleteUserModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="deleteUserModalLabel">Confirmar Exclusão</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <form id="deleteUserForm" method="post">
                    <div class="modal-body">
                        <p>Tem certeza que deseja excluir o usuário <strong id="deleteUsernameDisplay"></strong>?</p>
                        <p class="text-danger"><small>Esta ação não pode ser desfeita.</small></p>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-danger">Excluir</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- O Script foi movido para DENTRO da div .content-wrapper -->
    <script>
        $(document).ready(function() {
            // Popula o modal de edição
            $('.btn-edit').click(function() {
                var id = $(this).data('id');
                var username = $(this).data('username');
                var enabled = $(this).data('enabled');
                var roles = $(this).data('roles').split(',');

                $('#editUserForm').attr('action', '/users/' + id + '/update');
                $('#editUsername').val(username);
                $('#editPassword').val(''); // Limpa campo de senha
                $('#editEnabled').prop('checked', enabled === true || enabled === 'true');

                // Marca as checkboxes de permissões
                $('.role-checkbox').prop('checked', false);
                roles.forEach(function(role) {
                    $('input[name="roles"][value="' + role.trim() + '"]').prop('checked', true);
                });
            });

            // Popula o modal de exclusão
            $('.btn-delete').click(function() {
                var id = $(this).data('id');
                var username = $(this).data('username');

                $('#deleteUserForm').attr('action', '/users/' + id + '/delete');
                $('#deleteUsernameDisplay').text(username);
            });
        });
    </script>
</div>
</body>
</html>
